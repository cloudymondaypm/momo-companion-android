name: Build phone APK
on:
  push:
    paths: ['app-phone/**', '.github/workflows/phone-apk.yml']
  pull_request:
    paths: ['app-phone/**', '.github/workflows/phone-apk.yml']
  workflow_dispatch:
jobs:
  build-phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - name: Install Android components
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;25.1.8937393' 'cmake;3.22.1'
      - name: Validate 3D depth shaders
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools
          glslangValidator -S vert app-phone/app/src/main/res/raw/momo_depth_vertex.glsl
          glslangValidator -S frag app-phone/app/src/main/res/raw/momo_depth_fragment.glsl
      - run: chmod +x app-phone/gradlew && ./app-phone/gradlew -p app-phone assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with: {name: momo-companion-phone-debug, path: app-phone/app/build/outputs/apk/debug/*.apk, if-no-files-found: error}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Phone UI and 3D smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            ./app-phone/gradlew -p app-phone connectedDebugAndroidTest
            test_result=$?
            mkdir -p phone-preview
            adb exec-out run-as space.spacecloud.xiaozhi.fold5 cat files/phone-momo-depth.png > phone-preview/phone-momo-depth.png
            python3 -c "import pathlib,base64; p=pathlib.Path('phone-preview/phone-momo-depth.png'); print('MOMO_PREVIEW_BASE64='+base64.b64encode(p.read_bytes()).decode() if p.exists() and p.stat().st_size else 'No emulator preview available')"
            exit "$test_result"
      - name: Upload phone QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momo-phone-emulator-qa
          path: |
            phone-preview/*.png
            app-phone/app/build/reports/androidTests/connected/**
          if-no-files-found: warn
